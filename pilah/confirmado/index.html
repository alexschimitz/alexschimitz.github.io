<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Pilah · Confirmação de conta</title>
<style>
:root{color-scheme:light dark;--bg:#f6f7f9;--fg:#15171a;--card:#fff;--muted:#5b6170;--ok:#1a7f45;--err:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--fg:#eef0f3;--card:#191c22;--muted:#a3a9b6;--ok:#4ade80;--err:#f87171}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px}
main{background:var(--card);max-width:440px;width:100%;border-radius:16px;padding:32px 28px;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.08)}
.icon{font-size:48px;line-height:1}h1{font-size:1.4rem;margin:12px 0 8px}p{color:var(--muted);margin:0 0 8px}
.ok h1{color:var(--ok)}.err h1{color:var(--err)}
</style>
</head>
<body>
<main id="box" class="ok" aria-live="polite">
  <div class="icon" aria-hidden="true">✅</div>
  <h1 id="title">Conta confirmada</h1>
  <p id="msg">Seu e-mail foi confirmado. Volte ao app Pilah e faça login.</p>
  <p>Pode fechar esta página.</p>
</main>
<script>
(function(){
  var p=new URLSearchParams((location.hash||"").slice(1)+"&"+location.search.slice(1));
  var err=p.get("error")||p.get("error_code");
  if(err){
    var d=p.get("error_description")||"";
    var b=document.getElementById("box");b.className="err";
    b.querySelector(".icon").textContent="⚠️";
    document.getElementById("title").textContent="Não foi possível confirmar";
    var m=/expired/i.test(d+err)?"O link expirou ou já foi usado. No app, tente entrar de novo para receber um novo e-mail.":"Algo deu errado com o link. No app, tente entrar de novo para receber um novo e-mail.";
    document.getElementById("msg").textContent=m;
  }
  // remove tokens from the address bar; nothing is stored or sent
  if(location.hash||location.search){history.replaceState(null,"",location.pathname);}
})();
</script>
</body>
</html>
