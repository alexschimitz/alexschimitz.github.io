name: Politica - gastos publicos

on:
  schedule:
    - cron: "17 7 * * 1"   # toda segunda, 04:17 em Brasília
  workflow_dispatch:
    inputs:
      cpgf_max:
        description: "Máximo de arquivos mensais do cartão (CPGF) para baixar nesta rodada"
        required: false
        default: "20"

permissions:
  contents: write
  pages: write

concurrency:
  group: politica-gastos
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências
        run: |
          pip install --quiet openpyxl xlrd
          echo "GASTOS_RAW=$RUNNER_TEMP/raw" >> "$GITHUB_ENV"

      - name: União (Tesouro, SIOP, IPCA, população)
        timeout-minutes: 20
        continue-on-error: true
        run: python3 scripts/politica/gastos/fetch_uniao.py

      - name: Câmara e Senado (cotas)
        timeout-minutes: 15
        continue-on-error: true
        run: python3 scripts/politica/gastos/fetch_parl.py

      - name: Emendas parlamentares
        timeout-minutes: 8
        continue-on-error: true
        run: python3 scripts/politica/gastos/fetch_emendas.py

      - name: Viagens a serviço
        timeout-minutes: 10
        continue-on-error: true
        run: python3 scripts/politica/gastos/fetch_viagens.py

      - name: Cartão corporativo (CPGF)
        timeout-minutes: 25
        continue-on-error: true
        env:
          CPGF_MAX_DOWNLOADS: ${{ github.event.inputs.cpgf_max || '20' }}
          CPGF_BUDGET_S: "1200"
          CPGF_DELAY: "20"
        run: python3 scripts/politica/gastos/fetch_cartao.py

      - name: Portal da Transparência API (só com a chave)
        timeout-minutes: 10
        continue-on-error: true
        env:
          PORTAL_TRANSPARENCIA_KEY: ${{ secrets.PORTAL_TRANSPARENCIA_KEY }}
        run: python3 scripts/politica/gastos/fetch_portal_api.py

      - name: Metadados e limite de tamanho
        run: python3 scripts/politica/gastos/build_meta.py

      - name: Commit (só se os dados mudaram)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          changed=$(git status --porcelain -- politica/data/gastos | grep -v -E 'politica/data/gastos/(meta|fontes)\.json$' || true)
          if [ -z "$changed" ]; then
            echo "Sem mudanças nos dados."
            git checkout -- politica/data/gastos 2>/dev/null || true
            exit 0
          fi
          git add politica/data/gastos
          git commit -m "politica/gastos: atualiza dados ($(date -u +%Y-%m-%d))"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 10
          done
          echo "CHANGED=true" >> "$GITHUB_ENV"

      - name: Pedir build do Pages
        if: env.CHANGED == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || true
