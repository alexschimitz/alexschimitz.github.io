name: Dados de governo e propostas

on:
  schedule:
    - cron: '43 10 * * *' # diariamente às 10:43 UTC (07:43 em Brasília) — longe do painel (09:17 UTC)
  workflow_dispatch:
    inputs:
      anos:
        description: 'Anos para recoletar (ex.: 2019-2026). Vazio = ano atual e anterior.'
        required: false
        default: ''

permissions:
  contents: write
  pages: write

concurrency:
  group: politica-governo
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      POL_GOV_RAW: ${{ runner.temp }}/pol-governo-raw
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Atos do governo (leis, LCs, emendas, decretos, MPs, vetos — Senado)
        timeout-minutes: 15
        run: node scripts/politica/governo/normas.mjs ${{ inputs.anos && format('--anos={0}', inputs.anos) || '' }}

      - name: Catálogo de propostas (Câmara e Senado)
        timeout-minutes: 25
        run: node scripts/politica/governo/propostas.mjs --tram=150 ${{ inputs.anos && format('--anos={0}', inputs.anos) || '' }}

      - name: Ligações MP → proposta e contagem por presidente
        run: |
          node scripts/politica/governo/normas.mjs --offline ${{ inputs.anos && format('--anos={0}', inputs.anos) || '' }}
          node scripts/politica/governo/por-presidente.mjs

      - name: Eleição presidencial 2026 (TSE)
        continue-on-error: true
        timeout-minutes: 3
        run: node scripts/politica/governo/eleicoes.mjs

      - name: Índices e regras de resumo automático
        run: |
          node scripts/politica/governo/porta-simplifica.mjs
          node scripts/politica/governo/indices.mjs

      - name: Commit (se houver mudança)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A politica/data/governo politica/data/propostas politica/propostas/simplifica.js
          if git diff --cached --quiet; then
            echo "Sem mudanças."; echo "CHANGED=false" >> "$GITHUB_ENV"; exit 0
          fi
          git commit -m "politica/governo: atualiza atos, propostas e eleição ($(TZ=America/Sao_Paulo date '+%Y-%m-%d %H:%M') BRT)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep 15
          done
          echo "CHANGED=true" >> "$GITHUB_ENV"

      - name: Solicitar build do GitHub Pages (legacy)
        if: env.CHANGED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || echo "Pedido de build não aceito; o push já dispara o build."
