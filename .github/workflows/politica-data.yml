name: Dados de política

on:
  schedule:
    - cron: '17 9 * * *' # diariamente às 09:17 UTC (06:17 em Brasília)
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: politica-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Coletar dados abertos (Câmara, Senado, RSS)
        # ~11 min: gastos, projetos e detalhes de 513 deputados + 81 senadores
        run: node scripts/politica/fetch.mjs

      - name: Commit dos dados (se houver mudança)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A politica/data
          # Só commita se algo além do carimbo de horário (meta.json) mudou.
          if git diff --cached --quiet -- politica/data ':(exclude)politica/data/meta.json'; then
            echo "Sem mudanças nos dados (além do meta.json)."
            git reset -q
            echo "CHANGED=false" >> "$GITHUB_ENV"
            exit 0
          fi
          git commit -m "politica: atualiza dados abertos ($(TZ=America/Sao_Paulo date '+%Y-%m-%d %H:%M') BRT)"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "CHANGED=true" >> "$GITHUB_ENV"

      - name: Solicitar build do GitHub Pages (legacy)
        if: env.CHANGED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || echo "Pedido de build não aceito; o push já dispara o build legacy."
